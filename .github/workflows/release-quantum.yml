# Releases the Nova Quantum extension. Pushing a tag nova-quantum-v<version> (the version in
# editors/vscode/nova-quantum/package.json) checks the version, builds and tests the package, makes a GitHub release
# with it, and publishes it to the VS Code Marketplace and Open VSX (a pre-release for an odd minor version).
# Nova Quantum depends on the Nova extension, so Nova must be published first (docs/RELEASING.md). Run by hand, it
# is a dry run unless "publish" is ticked. Publishing needs the secrets VSCE_PAT and OVSX_PAT.
name: Release the Nova Quantum extension

on:
  push:
    tags: ['nova-quantum-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Marketplace and Open VSX (otherwise build, test, and stop)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-nova-quantum
  cancel-in-progress: false

jobs:
  package:
    name: Version, tests and package
    if: github.repository == 'parhitmtech/NovaQuantum'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    defaults:
      run:
        working-directory: editors/vscode/nova-quantum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "nova-quantum-v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match package.json's version $version (tag nova-quantum-v$version)"; exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version (a heading '## [$version]')"; exit 1
          fi
          minor=$(echo "$version" | cut -d. -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:grammar
      - run: npm run test:unit
      - run: npx vsce package --no-dependencies -o nova-quantum.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: nova-quantum.vsix
          path: editors/vscode/nova-quantum/nova-quantum.vsix

  release:
    name: Release ${{ needs.package.outputs.version }}
    needs: package
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
      PRERELEASE: ${{ needs.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v7
        with:
          name: nova-quantum.vsix
          path: packages
      - name: GitHub release, with the package attached
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} on && /^## \[/ {exit} on' \
            editors/vscode/nova-quantum/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" packages/nova-quantum.vsix --title "Nova Quantum extension $VERSION" \
            --notes-file notes.md $([ "$PRERELEASE" = true ] && echo --prerelease)
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::the secret VSCE_PAT is not set: add the Azure DevOps token (Settings > Secrets and variables > Actions; docs/RELEASING.md)"
            exit 1
          fi
          npx --yes @vscode/vsce@4.1.0 publish --packagePath packages/nova-quantum.vsix $([ "$PRERELEASE" = true ] && echo --pre-release)
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::the secret OVSX_PAT is not set: add the Open VSX token (Settings > Secrets and variables > Actions; docs/RELEASING.md)"
            exit 1
          fi
          npx --yes ovsx@1.4.0 publish packages/nova-quantum.vsix $([ "$PRERELEASE" = true ] && echo --pre-release)
